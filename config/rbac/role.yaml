---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - axonhub.onrender.com
  resources:
  - axonhubs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - axonhub.onrender.com
  resources:
  - axonhubs/finalizers
  verbs:
  - update
- apiGroups:
  - axonhub.onrender.com
  resources:
  - axonhubs/status
  verbs:
  - get
  - patch
  - update
