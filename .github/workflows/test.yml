name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Reset workspace permissions
        # envtest and tool downloads leave read-only files that block
        # the next run's checkout clean
        run: chmod -R u+w "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test
